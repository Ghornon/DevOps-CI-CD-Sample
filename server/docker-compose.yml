version: '3.8'
services:
    bun-server:
        build: .
        ports:
            - '8080:8080'
        environment:
            - PORT=8080
            - DB_HOST=db
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=postgres
            - DB_NAME=postgres
        depends_on:
            - postgres-db

    postgres-db:
        image: postgres:latest
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=postgres
        ports:
            - '5432:5432'
