version: '3.8'
services:
    bun-server:
        image: bun-server:development
        build:
            context: .
            target: 'development'
        volumes:
            - .:/app
            - /app/node_modules
        ports:
            - '8080:8080'
        environment:
            - PORT=8080
            - DB_HOST=postgres-db
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=postgres
            - DB_NAME=postgres
        depends_on:
            - postgres-db

    postgres-db:
        image: postgres:latest
        # also give the postgres service an alias on the default network
        networks:
            default:
                aliases:
                    - db
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=postgres
        ports:
            - '5432:5432'
