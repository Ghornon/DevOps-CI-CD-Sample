name: Provision Azure Infrastructure with Terraform

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

on:
  workflow_dispatch:

  push:
    paths:
      - "terraform/azure/**"
  pull_request:
    paths:
      - "terraform/azure/**"

permissions:
  id-token: write
  contents: read

jobs:
  Terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/azure/

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Create public SSH Key from GitHub Secrets
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa.pub

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: terraform plan -out tfplan
        continue-on-error: false

      # Save plan to artifacts
      - name: Publish Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./terraform/azure/tfplan

      # Create string output of Terraform Plan
      - name: Create String Output
        id: tf-plan-string
        run: |
          TERRAFORM_PLAN=$(terraform show -no-color tfplan)
          delimiter="$(openssl rand -hex 8)"
          echo "summary<<${delimiter}" >> $GITHUB_OUTPUT
          echo "## Terraform Plan Output" >> $GITHUB_OUTPUT
          echo "<details><summary>Click to expand</summary>" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```terraform' >> $GITHUB_OUTPUT
          echo "$TERRAFORM_PLAN" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "</details>" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      # Publish Terraform Plan as task summary
      - name: Publish Terraform Plan to Task Summary
        env:
          SUMMARY: ${{ steps.tf-plan-string.outputs.summary }}
        run: echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Extract Public IP and Create Ansible Inventory
        run: |
          # Get output 'vm_public_ip'
          IP_ADDRESS=$(terraform output -raw public_ip_address)
          USERNAME=$(terraform output -raw admin_username)

          # Create Ansible hosts.ini file
          echo "[azure_vms]" > ansible_hosts.ini
          echo "$IP_ADDRESS ansible_user=$USERNAME" >> ansible_hosts.ini

          echo "::notice file=ansible_hosts.ini::Inventory file created with IP: $IP_ADDRESS"

      - name: Upload Ansible Inventory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          path: ansible_hosts.ini

  Ansible:
    runs-on: ubuntu-latest
    needs: Terraform
    defaults:
      run:
        working-directory: ./ansible

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Ansible and Azure dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Create SSH Key from GitHub Secrets
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Download Ansible Inventory Artifact
        uses: actions/download-artifact@v4
        with:
          name: ansible-inventory

      - name: Run Ansible Playbook
        run: ansible-playbook -i ansible_hosts.ini configure_docker.yml
