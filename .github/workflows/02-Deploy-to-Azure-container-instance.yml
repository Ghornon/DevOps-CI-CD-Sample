name: Deploy to Azure Container Apps
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Docker build and publish to GHCR']
    types:
      - completed

env:
  AZURE_RESOURCE_GROUP: 'sample-rg'
  AZURE_LOCATION: 'westeurope'
  POSTGRES_HOST_NAME: 'sample-db-v2rga'
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'postgres'
  POSTGRES_DB: 'sampleDB'

permissions:
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Login via Azure CLI'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group if not exist
        uses: azure/CLI@v2
        with:
          inlineScript: |
            if [ $(az group exists --name ${{ env.AZURE_RESOURCE_GROUP }}) = false ]; then
              az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.AZURE_LOCATION }}
            fi

      - name: Deploy private GHCR image to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: sample-client
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/ghornon/sample-client:latest
          registryUrl: ghcr.io
          registryUsername: ${{ github.repository_owner }}
          registryPassword: ${{ secrets.GH_TOKEN }}
          location: ${{ env.AZURE_LOCATION }}
