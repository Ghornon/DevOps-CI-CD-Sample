name: Deploy to Azure Container Instance
on:
    workflow_dispatch:
    workflow_run:
        workflows: ['Docker build and publish to GHCR']
        types:
            - completed

jobs:
    deploy:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                component: [client, server]
        steps:
            # checkout the repo
            - name: 'Checkout GitHub Action'
              uses: actions/checkout@main

            - name: 'Login via Azure CLI'
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: 'Deploy to Azure Container Instances'
              uses: 'azure/aci-deploy@v1'
              with:
                  resource-group: 'sample-rg'
                  dns-name-label: 'sample-rg${{ github.run_number }}'
                  image: 'ghcr.io/${{github.repository_owner}}/sample-${{ matrix.component }}:latest'
                  registry-login-server: 'ghcr.io'
                  registry-username: ${{ github.repository_owner }}
                  registry-password: ${{ secrets.GH_TOKEN }}
                  name: 'sample-${{ matrix.component }}'
                  location: 'west europe'
